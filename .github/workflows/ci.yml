name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: "3.9"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: ubuntu-latest, python: "3.14"}
          - {os: macos-latest, python: "3.13"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Every number in the paper matches the committed results
        # Runs before the full run, which rewrites results/run_info.json with this machine's
        # Python version; the paper reports the version of the frozen run.
        run: python paper/check_numbers.py
      - name: Full run (refuses to run unless files match FREEZE.json; 61 checks)
        run: python run_sim.py
      - name: Committed results unchanged
        run: git diff --exit-code -- results ':(exclude)results/run_info.json'
      - name: Run twice and compare every output byte
        run: python run_sim.py --check-reproducible
      - name: Practitioner tools (explore and replay examples)
        run: |
          python run_sim.py explore --scenario examples/scenario_example.json --policy examples/custom_policy.py:PatientReconciler
          python run_sim.py replay --observations examples/replay_example.jsonl --policy D
